name: 功能建议
description: 提出新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在卡在哪里，为什么现有命令不够用
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案
      description: 命令形态、产物位置、与现有流水线的衔接
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及部分
      multiple: true
      options:
        - 语料层（导入 / 清洗 / 切章）
        - 蒸馏层（任务包 / 校验 / 入库）
        - 消费层（渲染 / 查询 / 续写包）
        - GUI
        - MCP
        - 打包与依赖
        - 文档
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 试过什么、为什么不行
    validations:
      required: false
